-- العودة للبيت عن طريق الحركة بسرعة 300
GoHomeBtn.MouseButton1Click:Connect(function()
    local char = LocalPlayer.Character
    local hrp = char and char:FindFirstChild("HumanoidRootPart")
    
    if SavedHomeCFrame and hrp then
        if IsMovingHome then return end
        IsMovingHome = true
        GoHomeBtn.Text = "⏳ جاري العودة..."

        local distance = (hrp.Position - SavedHomeCFrame.Position).Magnitude
        local duration = distance / 300

        local tween = TweenService:Create(hrp, TweenInfo.new(duration, Enum.EasingStyle.Linear), {
            CFrame = SavedHomeCFrame
        })
        tween:Play()
        tween.Completed:Connect(function()
            IsMovingHome = false
            GoHomeBtn.Text = "🏃 عودة للبيت (مشي 300)"
        end)
    else
        GoHomeBtn.Text = "⚠️ احفظ البيت أولاً"
        task.delay(1.5, function() GoHomeBtn.Text = "🏃 عودة للبيت (مشي 300)" end)
    end
end)

-- فتح وإغلاق الواجهة
local isMenuOpen = false
local function ToggleMenu()
    isMenuOpen = not isMenuOpen
    if isMenuOpen then
        MainFrame.Visible = true
        MainFrame.Size = UDim2.new(0, 0, 0, 0)
        MainFrame.Position = UDim2.new(0.5, 0, 0.5, 0)
        TweenService:Create(MainFrame, TweenInfo.new(0.3, Enum.EasingStyle.Back, Enum.EasingDirection.Out), {
            Size = UDim2.new(0, 330, 0, 460),
            Position = UDim2.new(0.5, -165, 0.5, -230)
        }):Play()
    else
        local tween = TweenService:Create(MainFrame, TweenInfo.new(0.2, Enum.EasingStyle.Quad, Enum.EasingDirection.In), {
            Size = UDim2.new(0, 0, 0, 0),
            Position = UDim2.new(0.5, 0, 0.5, 0)
        })
        tween:Play()
        tween.Completed:Connect(function() if not isMenuOpen then MainFrame.Visible = false end end)
    end
end

OpenButton.MouseButton1Click:Connect(ToggleMenu)
CloseButton.MouseButton1Click:Connect(ToggleMenu)

-- تحويل القيم النصية لرقمية (K, M, B, T)
local function ParseValue(str)
    if not str then return 0 end
    local num = tonumber(string.match(str, "%d+%.?%d*")) or 0
    if string.find(str, "T") or string.find(str, "t") then
        return num * 1000000000000
    elseif string.find(str, "B") or string.find(str, "b") then
        return num * 1000000000
    elseif string.find(str, "M") or string.find(str, "m") then
        return num * 1000000
    elseif string.find(str, "K") or string.find(str, "k") then
        return num * 1000
    end
    return num
end

-- فحص الماب مع استبعاد بيض المزارع
local function ScanMapEggs()
    local eggList = {}
    BestEggObject = nil
    local highestVal = -1

    for _, desc in pairs(workspace:GetDescendants()) do
        if desc:IsA("TextLabel") or desc:IsA("TextButton") then
            local text = desc.Text
            if string.find(text, "B") or string.find(text, "T") or string.find(text, "M") then
                local val = ParseValue(text)
                if val > 0 then
                    local eggObj = desc:FindFirstAncestorOfClass("Model") or desc:FindFirstAncestorOfClass("BasePart")
                    if eggObj then
                        local fullName = string.lower(eggObj:GetFullName())
                        -- استبعاد أي مجسم يتبع مزارع أو منصات زراعة
                        if not string.find(fullName, "farm") and not string.find(fullName, "plot") and not string.find(fullName, "base") and not string.find(fullName, "spawn") then
                            table.insert(eggList, {Object = eggObj, Label = text, Value = val})
                            if val > highestVal then
                                highestVal = val
                                BestEggObject = eggObj
                            end
                        end
                    end
                end
            end
        end
    end

    return eggList
end

-- تحديث قائمة البيض
local function PopulateEggList()
    SelectedEggObject = nil
    SelectedButtonInstance = nil

    for _, child in pairs(ScrollFrame:GetChildren()) do
        if child:IsA("TextButton") then child:Destroy() end
    end

    local scannedEggs = ScanMapEggs()

    if #scannedEggs == 0 then
        local emptyLabel = Instance.new("TextLabel")
        emptyLabel.Size = UDim2.new(1, 0, 0, 30)
        emptyLabel.BackgroundTransparency = 1
        emptyLabel.Text = "اضغط تحديث عند ظهور البيض"
        emptyLabel.TextColor3 = Color3.fromRGB(180, 180, 180)
        emptyLabel.Font = Enum.Font.Gotham
        emptyLabel.TextSize = 12
        emptyLabel.Parent = ScrollFrame
        return
    end

    for idx, data in ipairs(scannedEggs) do
        local itemBtn = Instance.new("TextButton")
        itemBtn.Size = UDim2.new(1, -10, 0, 36)
        itemBtn.BackgroundColor3 = Color3.fromRGB(35, 35, 50)
        
        local isBest = (data.Object == BestEggObject)
        itemBtn.Text = (isBest and "⭐ [أقوى بيضة] " or "") .. data.Object.Name .. " (" .. data.Label .. ")"
        itemBtn.TextColor3 = isBest and Color3.fromRGB(255, 215, 0) or Color3.fromRGB(240, 240, 240)
        itemBtn.Font = Enum.Font.GothamMedium
        itemBtn.TextSize = 11
        itemBtn.Parent = ScrollFrame

        local btnCorner = Instance.new("UICorner")
        btnCorner.CornerRadius = UDim.new(0, 8)
        btnCorner.Parent = itemBtn

        itemBtn.MouseButton1Click:Connect(function()
            SelectedEggObject = data.Object
            if SelectedButtonInstance then SelectedButtonInstance.BackgroundColor3 = Color3.fromRGB(35, 35, 50) end
            SelectedButtonInstance = itemBtn
            itemBtn.BackgroundColor3 = Color3.fromRGB(0, 180, 120)
        end)
    end

    ScrollFrame.CanvasSize = UDim2.new(0, 0, 0, UIListLayout.AbsoluteContentSize.Y + 10)
end

RefreshBtn.MouseButton1Click:Connect(PopulateEggList)

-- الانتقال إلى الموقع
local function TeleportTo(obj)
    if not obj then return end
    local targetCF = obj:IsA("Model") and obj:GetPivot() or obj.CFrame
    local char = LocalPlayer.Character
    if targetCF and char and char:FindFirstChild("HumanoidRootPart") then
        char.HumanoidRootPart.CFrame = targetCF * CFrame.new(0, 4, 0)
    end
end

GoBestEggBtn.MouseButton1Click:Connect(function()
